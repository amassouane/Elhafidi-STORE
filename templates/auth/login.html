{% extends 'base.html' %}
{% block title %}Connexion Admin - ELHAFIDI STORE{% endblock %}

{% block content %}
<div class="container" style="display: flex; justify-content: center; align-items: center; min-height: 60vh;">
    <div style="background-color: var(--bg-surface); padding: 3rem; border-radius: 8px; width: 100%; max-width: 450px; border-top: 4px solid var(--accent-gold);">
        <h1 style="text-align: center; margin-bottom: 2rem; font-size: 2.5rem;">CONNEXION <span style="color:var(--accent-gold);">ADMIN</span></h1>
        
        <form action="{{ url_for('auth.login') }}" method="POST">
            <div class="form-group">
                <label>Nom d'utilisateur</label>
                <input type="text" name="username" class="form-control" required style="padding: 1rem;">
            </div>
            
            <div class="form-group" style="margin-bottom: 2rem;">
                <label>Mot de passe</label>
                <input type="password" name="password" class="form-control" required style="padding: 1rem;">
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 1rem; font-size: 1.2rem;">SE CONNECTER</button>
        </form>
        
        <div style="text-align: center; margin-top: 1.5rem;">
            <a href="{{ url_for('main.index') }}" style="color: var(--text-muted); font-size: 0.9rem;"><i class="fas fa-arrow-left"></i> Retour à la boutique</a>
        </div>
    </div>
</div>
{% endblock %}
